{% extends "admin/change_list.html" %}

{% block content %}
  <!-- Display calculations above the changelist table -->
  <div class="metrics" style="margin-bottom: 20px;">
      <h2>Expense Summary</h2>
      <p><strong>Total Budget:</strong> ${{ total_budget }}</p>
      <p><strong>Total Spent:</strong> ${{ total_spent }}</p>
      <p><strong>Remaining Balance:</strong> ${{ balance }}</p>
  </div>

  <!-- Render the rest of the default change_list content -->
  {{ block.super }}
{% endblock %}
